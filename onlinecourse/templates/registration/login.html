{% extends 'onlinecourse/base.html' %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6 col-lg-4">
  <div class="card shadow-sm"><div class="card-body">
    <h1 class="h3 mb-3">Sign in</h1>
    {% if form.errors %}<div class="alert alert-danger">The username or password was not accepted.</div>{% endif %}
    <form method="post">{% csrf_token %}
      <div class="mb-3"><label class="form-label" for="id_username">Username</label>{{ form.username }}</div>
      <div class="mb-3"><label class="form-label" for="id_password">Password</label>{{ form.password }}</div>
      {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
      <button class="btn btn-primary w-100" type="submit">Sign in</button>
    </form>
  </div></div>
</div></div>
{% endblock %}
